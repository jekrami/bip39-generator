[package]
name = "bip39_generator"
version = "0.1.0"
edition = "2021"

[lib]
name = "bip39_generator_lib"
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = "0.8.5"
sha2 = "0.10.8"
clap = { version = "4.5.4", features = ["derive"] }
pyo3 = { version = "0.21.0", features = ["extension-module"] }
lazy_static = "1.4.0"
