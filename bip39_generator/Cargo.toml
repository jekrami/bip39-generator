[package]
name = "bip39_generator"
version = "1.1.0"
edition = "2021"
authors = ["Jafar Ekrami <ekrami@gmail.com>"]
description = "A BIP39 mnemonic generator written in Rust"
license = "MIT"
repository = "https://github.com/jekrami/bip39-generator.git"
readme = "README.md"
keywords = ["bip39", "mnemonic", "crypto", "wallet", "generator"]
categories = ["cryptography", "command-line-utilities"]

[lib]
name = "bip39_generator_lib"
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = "0.8.5"
sha2 = "0.10.8"
clap = { version = "4.5.4", features = ["derive"] }
pyo3 = { version = "0.21.0", features = ["extension-module"] }
lazy_static = "1.4.0"
